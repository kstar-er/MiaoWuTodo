name: Publish MiaoWuTodo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:              # 为这个 job 赋予明确权限
      contents: write         # 允许创建 Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog
        id: create_release
        run: npx changelogithub --draft --name ${{ steps.vars.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}

  build-app:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          # - platform: macos-latest
          #   target: x86_64-apple-darwin

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # - platform: windows-latest
          #   target: i686-pc-windows-msvc
          # - platform: windows-latest
          #   target: aarch64-pc-windows-msvc


    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Build the app
        id: build  
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MiaoWuTodo v__VERSION__' # __VERSION__ 会被自动替换
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false # 创建正式发布（false）还是草稿（true）
          prerelease: false
          args: --target ${{ matrix.target }}

  sync-to-gitee:
    needs: build-app
    if: always()  # 即使部分构建失败也执行同步
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync current GitHub Release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
          GITEE_OWNER: k_star
          GITEE_REPO: miao-wu-todo
          GH_OWNER: kstar-er
          GH_REPO: MiaoWuTodo
        run: |
          set -eu

          # Gitee attach_files 单文件硬性上限 100MB
          MAX_SIZE=$((100 * 1024 * 1024))
          FAILED=0

          upload_one() {
            local file="$1"
            local name
            name=$(basename "$file")
            local size
            size=$(stat -c %s "$file" 2>/dev/null || echo 0)

            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "  ⚠️  跳过 ${name}：文件 ${size}B 超过 100MB，Gitee attach_files 接口不支持"
              return 0
            fi

            echo "  上传 ${name} (${size}B)..."
            # -S: 出错时打印错误信息；-w: 附加 HTTP 状态码
            local resp http_code
            resp=$(curl -sS -w '\n__HTTP_STATUS__:%{http_code}' -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${gitee_release_id}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${file}")
            http_code=$(echo "$resp" | sed -n 's/^__HTTP_STATUS__://p')
            resp=$(echo "$resp" | sed '/^__HTTP_STATUS__:/d')

            # attach_files 成功返回是单元素数组；失败返回错误对象
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              local uploaded_name
              uploaded_name=$(echo "$resp" | jq -r 'if type=="array" then (.[0].name // "unknown") else (.name // "unknown") end')
              if [ "$uploaded_name" != "unknown" ] && [ -n "$uploaded_name" ] && [ "$uploaded_name" != "null" ]; then
                echo "  ✅ 已上传: ${uploaded_name}"
                return 0
              fi
              echo "  ❌ 上传返回 200 但未取到文件名"
              echo "  原始返回: ${resp}"
              return 1
            else
              echo "  ❌ 上传失败 HTTP=${http_code}"
              echo "  原始返回: ${resp}"
              return 1
            fi
          }

          echo "=== 获取 GitHub Release 信息 ==="
          release_data=$(gh api "repos/${GH_OWNER}/${GH_REPO}/releases/tags/${TAG}")
          release_body=$(echo "$release_data" | jq -r '.body // ""')
          release_name=$(echo "$release_data" | jq -r '.name // ""')
          echo "Release: ${release_name} (${TAG})"

          echo "=== 检查 Gitee 上是否存在该 Release ==="
          gitee_release_id=$(curl -sS -X GET \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -H "Authorization: token ${GITEE_TOKEN}" | jq -r '.id // ""')

          if [ -z "$gitee_release_id" ] || [ "$gitee_release_id" = "null" ]; then
            echo "=== Gitee 上不存在该 Release，创建 ==="
            create_result=$(curl -sS -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -d "$(jq -n \
                --arg tag "$TAG" \
                --arg name "$release_name" \
                --arg body "$release_body" \
                '{tag_name: $tag, name: $name, body: $body, target_commitish: $tag, prerelease: false}')")
            gitee_release_id=$(echo "$create_result" | jq -r '.id // ""')
            echo "Created Gitee Release ID: ${gitee_release_id}"
            if [ -z "$gitee_release_id" ] || [ "$gitee_release_id" = "null" ]; then
              echo "❌ 创建 Gitee Release 失败，原始返回: ${create_result}"
              exit 1
            fi
          else
            echo "Gitee 上已存在 Release ID: ${gitee_release_id}"
          fi

          echo "=== 下载并上传附件到 Gitee ==="
          # 用临时文件作为 while 的输入流，避免子 shell 中 FAILED 累加失效
          echo "$release_data" | jq -c '.assets[]?' > /tmp/_assets_list.txt
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            asset_name=$(echo "$asset" | jq -r '.name')
            asset_size=$(echo "$asset" | jq -r '.size')
            asset_url=$(echo "$asset" | jq -r '.url')
            echo "  处理附件: ${asset_name} (${asset_size}B)"

            # 获取附件下载 URL
            download_url=$(gh api "$asset_url" --jq '.browser_download_url')
            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              echo "  ❌ 获取下载链接失败"
              FAILED=1
              continue
            fi

            # 下载附件
            local_path="/tmp/${asset_name}"
            if ! curl -sSL --fail -o "$local_path" "$download_url"; then
              echo "  ❌ 下载失败: $download_url"
              FAILED=1
              rm -f "$local_path"
              continue
            fi

            # 上传
            if ! upload_one "$local_path"; then
              FAILED=1
            fi

            # 清理
            rm -f "$local_path"
          done < /tmp/_assets_list.txt
          rm -f /tmp/_assets_list.txt

          echo "=== 同步完成 ==="
          if [ "$FAILED" = "1" ]; then
            echo "⚠️  部分附件同步失败，请查看上方日志"
            exit 1
          fi
          echo "✅ 全部附件同步成功"

  publish-updater-manifest:
    needs: sync-to-gitee
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download updater manifest from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --dir release-assets

      - name: Rewrite updater manifest to Gitee release URLs
        env:
          GITEE_RELEASE_BASE: https://gitee.com/k_star/miao-wu-todo/releases/download/${{ github.ref_name }}
        run: |
          node scripts/rewrite-updater-manifest.mjs \
            --input release-assets/latest.json \
            --output release-assets/latest.gitee.json \
            --tag "${{ github.ref_name }}"

      - name: Upload updater manifest to OSS
        env:
          ALI_OSS_ACCESS_KEY_ID: ${{ secrets.ALI_OSS_ACCESS_KEY_ID }}
          ALI_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALI_OSS_ACCESS_KEY_SECRET }}
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
          ALI_OSS_REGION: ${{ secrets.ALI_OSS_REGION }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
          ALI_OSS_STS_TOKEN: ${{ secrets.ALI_OSS_STS_TOKEN }}
          ALI_OSS_OBJECT_KEY: ${{ secrets.ALI_OSS_OBJECT_KEY || 'latest.json' }}
        run: |
          node scripts/upload-oss-file.mjs \
            --file release-assets/latest.gitee.json \
            --key "${ALI_OSS_OBJECT_KEY}"
